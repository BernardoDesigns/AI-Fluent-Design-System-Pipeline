<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F0E0D;
    --surface: #1A1918;
    --border: rgba(255,255,255,0.15);
    --border-md: rgba(255,255,255,0.28);
    --text: #F0EDE8;
    --text2: #8A8882;
    --text3: #959590;
    --discover: #D85A30;
    --r: 10px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #FAFAF8;
      --surface: #F0EDE8;
      --border: rgba(0,0,0,0.08);
      --border-md: rgba(0,0,0,0.15);
      --text: #1A1918;
      --text2: #6A6866;
      --text3: #4d4d4d;
    }
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 28px;
  }

  .unlock {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 40px 32px;
  }

  .unlock-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .unlock-logo img {
    height: 48px;
    width: auto;
    display: block;
    border-radius: 50%;
  }

  .unlock-form { display: flex; flex-direction: column; gap: 12px; }

  .unlock-input {
    width: 100%;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border-md);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s;
  }

  .unlock-input::placeholder { color: var(--text3); }
  .unlock-input:focus { border-color: var(--text2); }

  .unlock-btn {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--bg);
    background: var(--text);
    border: 1px solid var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: opacity .15s, transform .15s;
    letter-spacing: .01em;
  }

  .unlock-btn:hover { opacity: .9; transform: translateY(-1px); }
  .unlock-btn:disabled { opacity: .5; cursor: default; transform: none; }

  .unlock-error {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--discover);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-top: 4px;
    min-height: 14px;
  }
</style>
</head>
<body>

<form class="unlock" id="unlock-form" autocomplete="off">
  <div class="unlock-logo">
    <img src="assets/logo.png" alt="">
  </div>

  <div class="unlock-form">
    <input
      type="password"
      id="unlock-password"
      class="unlock-input"
      placeholder="Password"
      autocomplete="current-password"
      autofocus
      required
    >
    <button type="submit" class="unlock-btn" id="unlock-btn">Unlock</button>
    <div class="unlock-error" id="unlock-error" aria-live="polite"></div>
  </div>
</form>

<script>
  const form = document.getElementById('unlock-form');
  const input = document.getElementById('unlock-password');
  const btn = document.getElementById('unlock-btn');
  const errEl = document.getElementById('unlock-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value }),
      });
      const data = await res.json().catch(() => ({ ok: false }));

      if (data.ok) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.assign(next);
        return;
      }

      errEl.textContent = 'Incorrect password';
      input.value = '';
      input.focus();
    } catch {
      errEl.textContent = 'Something went wrong. Try again.';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
